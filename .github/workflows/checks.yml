name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check documentation, tests and examples
        run: python .suite/tools/check_repository.py

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard preview dependency
        run: python -m pip install -r .suite/dashboard/requirements.txt
      - name: Test dashboard files, HTTP and adapters
        run: python -m unittest discover -s .suite/dashboard/tests -v
      - name: Check browser JavaScript
        run: node --check .suite/dashboard/web/app.js

  webmodules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUIRE_PHP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PHP runtime and syntax
        run: |
          php --version
          find website/.nocms/module -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test standalone webmodules with real local PHP HTTP endpoints
        run: python -m unittest discover -s website/.nocms/tests -v
      - name: Check browser module JavaScript
        run: |
          node --check website/.nocms/module/site-search/site-search.js
          node --check website/.nocms/module/analytics-lite/analytics-lite.js

      - name: Test local browser module behavior
        run: node --test website/.nocms/tests/test_browser_modules.cjs
